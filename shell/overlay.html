<!doctype html>
<!-- Transition overlay (workspace-tj1z.2): an opaque full-window stage that plays the
     pane reveal/collapse as compositor-driven WAAPI transforms over capturePage
     snapshots. The REAL WebContentsViews never animate — they snap underneath while
     this stage covers the window. Inert by doctrine: never focused, all input is
     forwarded to the terminal by main. Loaded ONCE from the loopback static server
     with no #wc- fragment so the CDP driver can never adopt it. -->
<html>
<head>
<meta charset="utf-8">
<!-- The drawer handle's proxy is cut from the SAME stylesheet the resting handle pane
     uses (workspace-2dmuu), so the bar the user watches travel is materially identical
     to the one it hands off to when this stage drops. -->
<link rel="stylesheet" href="launcher/tokens.css">
<link rel="stylesheet" href="handle/handle.css">
<style>
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; }
  /* Backdrop pair: the reader snapshot behind the sliding card. #backA is the frame
     captured before the transition; #backB fades in over it after the single pty
     reflow settles (crossfade masks the rewrap). Top-left anchored, CSS-px sized. */
  #backA, #backB { position: absolute; top: 0; left: 0; }
  #backB { opacity: 0; }
  /* Scrim: opacity-only dimmer over the reader while the card is in flight. */
  #scrim { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* Page card: moved ONLY by translateX. Shadow + a left-corner radius that eases
     away as it docks sell the macOS-sheet glide. */
  #card {
    position: absolute; top: 0; left: 0;
    box-shadow: -24px 0 48px rgba(0, 0, 0, .45), -4px 0 12px rgba(0, 0, 0, .35);
    border-top-left-radius: 8px; border-bottom-left-radius: 8px;
    overflow: hidden; display: none;
  }
  #card img { display: block; }
  /* Drawer-handle proxy: a sibling AFTER #card so it rides ON the sliding page (its
     destination is the card's top edge) instead of being clipped by #card's overflow.
     Moved only by transform — compositor-only, no layout per frame. The clip window is
     the SAME 8px the resting pane's strip imposes, so the bloom cannot change size when
     this stage drops off the real handle. cursor:pointer + the click listener below make
     the bar the one live control on an otherwise inert overlay: mid-flight the mouse can
     reverse the drawer exactly as pressing | already can. */
  #handleClip {
    left: 0; top: 0; display: none;
    transform-origin: center; will-change: transform;
    cursor: pointer;
  }
  #handle { left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
  <img id="backA" alt="">
  <img id="backB" alt="">
  <div id="scrim"></div>
  <div id="card"><img id="cardImg" alt=""></div>
  <div id="handleClip" class="wc-bar-clip"><div id="handle" class="wc-bar"></div></div>
<script>
  const backA = document.getElementById('backA')
  const backB = document.getElementById('backB')
  const card = document.getElementById('card')
  const cardImg = document.getElementById('cardImg')
  const scrim = document.getElementById('scrim')
  const handle = document.getElementById('handle')
  const handleClip = document.getElementById('handleClip')

  const anim = { phase: 'idle', gen: 0, slide: null, corner: null, scrimAnim: null, fade: null, handleAnim: null, x0: 0, x1: 0 }

  // The CLIP is positioned by the bar's CENTRE: rotating a len×thick box about its own
  // centre gives a thick×len box centred on the same point, which is what makes the
  // vertical→horizontal change one object turning rather than two bars crossfading.
  // The clip is longer than the bar so only the bloom's thin axis is ever cut — the
  // same window the resting strip imposes.
  const CLIP_PAD = 40   // long-axis slack: the bloom must never be cut along the bar
  const CLIP_THICK = 8  // thin-axis window: EXACTLY the resting strip's 8px
  function barTransform (g, len) {
    return `translate(${g.cx - (len + CLIP_PAD) / 2}px, ${g.cy - CLIP_THICK / 2}px) rotate(${g.deg}deg)`
  }

  // The one live control on an inert stage. Everything else on this overlay absorbs the
  // mouse by design; the bar must not, or it would be a visibly animating control that
  // ignores clicks for the 340ms it is most obviously there.
  handleClip.addEventListener('click', e => { e.stopPropagation(); window.wcov.handleClick() })

  function cancelAll () {
    for (const a of [anim.slide, anim.corner, anim.scrimAnim, anim.fade, anim.handleAnim]) { try { a && a.cancel() } catch {} }
    anim.slide = anim.corner = anim.scrimAnim = anim.fade = anim.handleAnim = null
    anim.phase = 'idle'
    card.style.display = 'none'
    handleClip.style.display = 'none'
    backA.removeAttribute('src')
    backB.removeAttribute('src')
    backB.style.opacity = '0'
  }

  window.wcov.onBegin(async p => {
    cancelAll()
    anim.gen = p.gen
    anim.phase = 'prep'
    anim.x0 = p.cardX0
    anim.x1 = p.cardX1
    anim.params = p
    backA.src = p.backImg
    backA.style.width = p.backW + 'px'
    backA.style.height = p.h + 'px'
    backB.style.opacity = '0'
    cardImg.src = p.cardImg
    cardImg.style.width = p.pageW + 'px'
    cardImg.style.height = p.h + 'px'
    card.style.width = p.pageW + 'px'
    card.style.height = p.h + 'px'
    card.style.transform = `translateX(${p.cardX0}px)`
    card.style.display = 'block'
    // Drawer handle: staged here, but whether to DRAW it is decided at wcov:go from
    // freshly re-evaluated availability — a transition on the launcher (or before any
    // page exists) must show no bar at all.
    handle.style.width = p.barLen + 'px'
    handle.style.height = p.barThick + 'px'
    handleClip.style.width = (p.barLen + CLIP_PAD) + 'px'
    handleClip.style.height = CLIP_THICK + 'px'
    handleClip.style.transform = barTransform(p.handleFrom, p.barLen)
    handleClip.style.display = 'none'
    try { await Promise.all([backA.decode(), cardImg.decode()]) } catch {}
    window.wcov.armed(p.gen)
  })

  window.wcov.onGo(p => {
    if (p.gen !== anim.gen) return
    anim.handleOn = !!p.handleOn
    handleClip.style.display = anim.handleOn ? 'block' : 'none'
    const { durMs, easing, scrimFrom, scrimTo, cornerFrom, cornerTo } = anim.params
    anim.phase = 'slide'
    anim.slide = card.animate(
      [{ transform: `translateX(${anim.x0}px)` }, { transform: `translateX(${anim.x1}px)` }],
      { duration: durMs, easing, fill: 'forwards' })
    // Left-corner radius eases over the final 80ms of the slide (radius only matters
    // as the card meets the edge). fill:forwards pins the end state.
    anim.corner = card.animate(
      [{ borderTopLeftRadius: cornerFrom + 'px', borderBottomLeftRadius: cornerFrom + 'px', offset: 0 },
        { borderTopLeftRadius: cornerFrom + 'px', borderBottomLeftRadius: cornerFrom + 'px', offset: Math.max(0, 1 - 80 / durMs) },
        { borderTopLeftRadius: cornerTo + 'px', borderBottomLeftRadius: cornerTo + 'px', offset: 1 }],
      { duration: durMs, fill: 'forwards' })
    anim.scrimAnim = scrim.animate(
      [{ opacity: scrimFrom }, { opacity: scrimTo }],
      { duration: durMs, easing: 'linear', fill: 'forwards' })
    // The handle travels on the card's own easing, but TIPS OVER late: at 62% of the
    // slide it has covered ~72% of the distance and only ~32% of the rotation, so the
    // drawer comes out first and the pull swings down onto it — a drawer being opened,
    // not a bar being tweened. The mid keyframe is what makes it read as physical.
    const { handleFrom, handleTo, barLen } = anim.params
    if (anim.handleOn) {
      const lerp = (a, b, t) => a + ((b - a) * t)
      const mid = {
        cx: lerp(handleFrom.cx, handleTo.cx, 0.72),
        cy: lerp(handleFrom.cy, handleTo.cy, 0.72),
        deg: lerp(handleFrom.deg, handleTo.deg, 0.32)
      }
      anim.handleAnim = handleClip.animate([
        { transform: barTransform(handleFrom, barLen), offset: 0 },
        { transform: barTransform(mid, barLen), offset: 0.62 },
        { transform: barTransform(handleTo, barLen), offset: 1 }
      ], { duration: durMs, easing, fill: 'forwards' })
    }
    anim.slide.onfinish = () => { window.wcov.done(anim.gen, 'slide') }
  })

  window.wcov.onCrossfade(async p => {
    if (p.gen !== anim.gen) return
    backB.src = p.img
    backB.style.width = p.backW + 'px'
    backB.style.height = p.h + 'px'
    try { await backB.decode() } catch {}
    anim.fade = backB.animate([{ opacity: 0 }, { opacity: 1 }], { duration: p.durMs, easing: 'ease', fill: 'forwards' })
    anim.fade.onfinish = () => { window.wcov.done(anim.gen, 'crossfade') }
  })

  // Mid-flight reversal (workspace-tj1z.4): the SAME snapshots serve both directions —
  // WAAPI reverse() replays the slide/corner/scrim back to their starting states.
  // onfinish still fires at the reversed end, so main's slide-done handling is uniform.
  window.wcov.onReverse(p => {
    if (p.gen !== anim.gen || !anim.slide) return
    anim.phase = 'slide'
    // The handle MUST be in this array. Every animation here carries fill:'forwards',
    // so one left out would run on to the wrong end and stay pinned there — the bar
    // would sit horizontal over a drawer that had just shut.
    for (const a of [anim.slide, anim.corner, anim.scrimAnim, anim.handleAnim]) { try { a && a.reverse() } catch {} }
  })

  window.wcov.onAbort(() => cancelAll())

  // Gate introspection (workspace-tj1z.5): live card position in CSS px.
  window.__anim = () => {
    let cardX = null
    if (card.style.display !== 'none') {
      const m = getComputedStyle(card).transform
      const match = /matrix\(([^)]+)\)/.exec(m)
      if (match) cardX = Math.round(parseFloat(match[1].split(',')[4]))
      else if (m === 'none') cardX = 0
    }
    const progress = anim.slide && anim.slide.effect
      ? (anim.slide.currentTime || 0) / (anim.slide.effect.getTiming().duration || 1)
      : null
    // Live handle geometry, read back off the composited matrix — a gate asserts where
    // the bar actually IS and which way it runs, not that an animation object exists.
    let hnd = null
    if (handleClip.style.display !== 'none') {
      const r = handle.getBoundingClientRect()
      hnd = {
        cx: Math.round(r.left + (r.width / 2)),
        cy: Math.round(r.top + (r.height / 2)),
        w: Math.round(r.width),
        h: Math.round(r.height),
        orient: r.width >= r.height ? 'horizontal' : 'vertical'
      }
    }
    return { phase: anim.phase, gen: anim.gen, cardX, progress, handle: hnd }
  }
</script>
</body>
</html>
