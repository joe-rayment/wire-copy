<!doctype html>
<!-- Transition overlay (workspace-tj1z.2): an opaque full-window stage that plays the
     pane reveal/collapse as compositor-driven WAAPI transforms over capturePage
     snapshots. The REAL WebContentsViews never animate — they snap underneath while
     this stage covers the window. Inert by doctrine: never focused, all input is
     forwarded to the terminal by main. Loaded ONCE from the loopback static server
     with no #wc- fragment so the CDP driver can never adopt it. -->
<html>
<head>
<meta charset="utf-8">
<!-- The drawer handle's proxy is cut from the SAME stylesheet the resting handle pane
     uses (workspace-2dmuu), so the bar the user watches travel is materially identical
     to the one it hands off to when this stage drops. -->
<link rel="stylesheet" href="launcher/tokens.css">
<link rel="stylesheet" href="handle/handle.css">
<style>
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; }
  /* Backdrop pair: the reader snapshot behind the sliding card. #backA is the frame
     captured before the transition; #backB fades in over it after the single pty
     reflow settles (crossfade masks the rewrap). Top-left anchored, CSS-px sized. */
  #backA, #backB { position: absolute; top: 0; left: 0; }
  #backB { opacity: 0; }
  /* Scrim: opacity-only dimmer over the reader while the card is in flight. */
  #scrim { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* Page card: moved ONLY by translateX. Shadow + a left-corner radius that eases
     away as it docks sell the macOS-sheet glide. */
  #card {
    position: absolute; top: 0; left: 0;
    box-shadow: -24px 0 48px rgba(0, 0, 0, .45), -4px 0 12px rgba(0, 0, 0, .35);
    border-top-left-radius: 8px; border-bottom-left-radius: 8px;
    overflow: hidden; display: none;
  }
  #card img { display: block; }
  /* Drawer-rail proxy: siblings AFTER #card so they ride ON the sliding page (their
     destination is the card's top edge) instead of being clipped by #card's overflow.
     The rail HINGES AROUND THE WINDOW'S TOP-RIGHT CORNER, which both of its states
     share: shut it runs down the dock edge from that corner, open it runs left along
     the top from the same corner. So it folds up into the corner and unrolls along the
     other axis, rather than pivoting about its own middle — a 900px rail spun about its
     centre sweeps an enormous diagonal wedge across the page, which reads as a glitch
     rather than a drawer. That means animating the fill's RECT (one small box, no text
     inside) instead of transforming it, so the phosphor edges keep their true 2px
     thickness at every frame. cursor:pointer + the click listener below make the rail
     the one live control on an otherwise inert overlay: mid-flight the mouse can
     reverse the drawer exactly as pressing | already can. */
  #railFill {
    position: absolute; display: none; background: #000; cursor: pointer; overflow: hidden;
  }
  #strokeL { left: 0; top: 0; width: 2px; height: 100%; }
  #strokeB { left: 0; bottom: 0; width: 100%; height: 2px; }
  /* TWO labels, because the wording changes with the drawer: "show" becomes "hide".
     They ride the same path and cross-fade inside the fold, where both are invisible —
     which also means a mid-flight reversal just replays them backwards, with no timer
     to swap text at the right moment and no wrong caption left pinned if it aborts. */
  #railLabelA, #railLabelB {
    position: absolute; left: 0; top: 0; display: none;
    transform-origin: center; will-change: transform;
  }
</style>
</head>
<body>
  <img id="backA" alt="">
  <img id="backB" alt="">
  <div id="scrim"></div>
  <div id="card"><img id="cardImg" alt=""></div>
  <div id="railFill">
    <div id="strokeL" class="wc-rail-stroke"></div>
    <div id="strokeB" class="wc-rail-stroke"></div>
  </div>
  <div id="railLabelA" class="wc-rail-label"></div>
  <div id="railLabelB" class="wc-rail-label"></div>
<script>
  const backA = document.getElementById('backA')
  const backB = document.getElementById('backB')
  const card = document.getElementById('card')
  const cardImg = document.getElementById('cardImg')
  const scrim = document.getElementById('scrim')
  const railFill = document.getElementById('railFill')
  const strokeL = document.getElementById('strokeL')
  const strokeB = document.getElementById('strokeB')
  const railLabelA = document.getElementById('railLabelA')
  const railLabelB = document.getElementById('railLabelB')

  // Same composition as the resting pane: eyebrow mark, the action, then the shortcut
  // in the app's [key] idiom.
  const labelHtml = g =>
    `<span class="mark">▌</span> ${g.action}` +
    `<span class="kbd"><span class="brk">[</span><span class="key">${g.key}</span><span class="brk">]</span></span>`

  const anim = {
    phase: 'idle', gen: 0, x0: 0, x1: 0,
    slide: null, corner: null, scrimAnim: null, fade: null,
    fillAnim: null, labelAAnim: null, labelBAnim: null, strokeLAnim: null, strokeBAnim: null
  }
  // Where the fold happens: by 45% of the slide the rail has retracted into the corner
  // nub, and it unrolls along the other axis over the rest. Sequencing the two axes is
  // what keeps the shape a rail throughout — interpolating both at once would swell it
  // into a block covering a quarter of the window at the midpoint.
  const FOLD = 0.45

  const rectFrame = r => ({ left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' })
  // The corner nub both states fold through: the top-right corner is shared, so it is
  // the rail's own thickness square tucked into it.
  const nubOf = (from, to) => {
    const cornerX = from.x + from.w // === to.x + to.w, the window's right edge
    const thick = Math.min(from.w, to.h)
    return { x: cornerX - thick, y: 0, w: thick, h: thick }
  }
  function labelTransform (g) {
    return `translate(${g.cx}px, ${g.cy}px) rotate(${g.deg}deg) translate(-50%, -50%)`
  }

  // The one live control on an inert stage. Everything else on this overlay absorbs the
  // mouse by design; the bar must not, or it would be a visibly animating control that
  // ignores clicks for the 340ms it is most obviously there.
  for (const el of [railFill, railLabelA, railLabelB]) {
    el.addEventListener('click', e => { e.stopPropagation(); window.wcov.handleClick() })
  }

  function cancelAll () {
    for (const a of [anim.slide, anim.corner, anim.scrimAnim, anim.fade,
      anim.fillAnim, anim.labelAAnim, anim.labelBAnim, anim.strokeLAnim, anim.strokeBAnim]) { try { a && a.cancel() } catch {} }
    anim.slide = anim.corner = anim.scrimAnim = anim.fade = null
    anim.fillAnim = anim.labelAAnim = anim.labelBAnim = anim.strokeLAnim = anim.strokeBAnim = null
    anim.phase = 'idle'
    card.style.display = 'none'
    railFill.style.display = 'none'
    railLabelA.style.display = 'none'
    railLabelB.style.display = 'none'
    backA.removeAttribute('src')
    backB.removeAttribute('src')
    backB.style.opacity = '0'
  }

  window.wcov.onBegin(async p => {
    cancelAll()
    anim.gen = p.gen
    anim.phase = 'prep'
    anim.x0 = p.cardX0
    anim.x1 = p.cardX1
    anim.params = p
    backA.src = p.backImg
    backA.style.width = p.backW + 'px'
    backA.style.height = p.h + 'px'
    backB.style.opacity = '0'
    cardImg.src = p.cardImg
    cardImg.style.width = p.pageW + 'px'
    cardImg.style.height = p.h + 'px'
    card.style.width = p.pageW + 'px'
    card.style.height = p.h + 'px'
    card.style.transform = `translateX(${p.cardX0}px)`
    card.style.display = 'block'
    // Drawer rail: staged here, but whether to DRAW it is decided at wcov:go from
    // freshly re-evaluated availability — a transition on the launcher (or before any
    // page exists) must show no rail at all.
    Object.assign(railFill.style, rectFrame(p.handleFrom.rect))
    strokeL.style.width = p.railStroke + 'px'
    strokeB.style.height = p.railStroke + 'px'
    // The phosphor edge is on whichever side faces the reader: the rail's left while
    // the drawer is shut, its underside once open. They cross-fade through the fold.
    strokeL.style.opacity = p.handleFrom.vertical ? '1' : '0'
    strokeB.style.opacity = p.handleFrom.vertical ? '0' : '1'
    railLabelA.innerHTML = labelHtml(p.handleFrom)
    railLabelB.innerHTML = labelHtml(p.handleTo)
    railLabelA.style.transform = labelTransform(p.handleFrom)
    railLabelB.style.transform = labelTransform(p.handleFrom)
    railLabelA.style.opacity = '1'
    railLabelB.style.opacity = '0'
    railFill.style.display = 'none'
    railLabelA.style.display = 'none'
    railLabelB.style.display = 'none'
    try { await Promise.all([backA.decode(), cardImg.decode()]) } catch {}
    window.wcov.armed(p.gen)
  })

  window.wcov.onGo(p => {
    if (p.gen !== anim.gen) return
    anim.handleOn = !!p.handleOn
    railFill.style.display = anim.handleOn ? 'block' : 'none'
    railLabelA.style.display = anim.handleOn ? 'block' : 'none'
    railLabelB.style.display = anim.handleOn ? 'block' : 'none'
    const { durMs, easing, scrimFrom, scrimTo, cornerFrom, cornerTo } = anim.params
    anim.phase = 'slide'
    anim.slide = card.animate(
      [{ transform: `translateX(${anim.x0}px)` }, { transform: `translateX(${anim.x1}px)` }],
      { duration: durMs, easing, fill: 'forwards' })
    // Left-corner radius eases over the final 80ms of the slide (radius only matters
    // as the card meets the edge). fill:forwards pins the end state.
    anim.corner = card.animate(
      [{ borderTopLeftRadius: cornerFrom + 'px', borderBottomLeftRadius: cornerFrom + 'px', offset: 0 },
        { borderTopLeftRadius: cornerFrom + 'px', borderBottomLeftRadius: cornerFrom + 'px', offset: Math.max(0, 1 - 80 / durMs) },
        { borderTopLeftRadius: cornerTo + 'px', borderBottomLeftRadius: cornerTo + 'px', offset: 1 }],
      { duration: durMs, fill: 'forwards' })
    anim.scrimAnim = scrim.animate(
      [{ opacity: scrimFrom }, { opacity: scrimTo }],
      { duration: durMs, easing: 'linear', fill: 'forwards' })
    // The rail folds into the shared top-right corner and unrolls along the other axis,
    // on the card's own easing so the two arrive together. The label rides the same
    // path but fades through the fold: at the nub it would overhang a 30px square, and
    // turning type mid-flight is only legible at the ends anyway.
    const { handleFrom, handleTo } = anim.params
    if (anim.handleOn) {
      const opts = { duration: durMs, easing, fill: 'forwards' }
      const nub = nubOf(handleFrom.rect, handleTo.rect)
      anim.fillAnim = railFill.animate([
        { ...rectFrame(handleFrom.rect), offset: 0 },
        { ...rectFrame(nub), offset: FOLD },
        { ...rectFrame(handleTo.rect), offset: 1 }
      ], opts)
      const lerp = (a, b, k) => a + ((b - a) * k)
      const mid = {
        cx: lerp(handleFrom.cx, handleTo.cx, 0.5),
        cy: lerp(handleFrom.cy, handleTo.cy, 0.5),
        deg: lerp(handleFrom.deg, handleTo.deg, 0.5)
      }
      // The outgoing caption fades before the fold, the incoming one after it, so the
      // wording changes while nothing is legible.
      const path = [
        { transform: labelTransform(handleFrom), offset: 0 },
        { transform: labelTransform(mid), offset: 0.5 },
        { transform: labelTransform(handleTo), offset: 1 }
      ]
      const withOpacity = (fades) => path.map((f, i) => ({ ...f, opacity: fades[i] }))
      anim.labelAAnim = railLabelA.animate(withOpacity([1, 0, 0]), opts)
      anim.labelBAnim = railLabelB.animate(withOpacity([0, 0, 1]), opts)
      // The phosphor edge changes sides at the fold, where the rail is a square and
      // neither side reads as long — the only moment the swap is invisible.
      const strokeOpts = { duration: durMs, easing: 'linear', fill: 'forwards' }
      const vFrom = handleFrom.vertical ? 1 : 0
      anim.strokeLAnim = strokeL.animate(
        [{ opacity: vFrom }, { opacity: vFrom, offset: FOLD }, { opacity: 1 - vFrom }], strokeOpts)
      anim.strokeBAnim = strokeB.animate(
        [{ opacity: 1 - vFrom }, { opacity: 1 - vFrom, offset: FOLD }, { opacity: vFrom }], strokeOpts)
    }
    anim.slide.onfinish = () => { window.wcov.done(anim.gen, 'slide') }
  })

  window.wcov.onCrossfade(async p => {
    if (p.gen !== anim.gen) return
    backB.src = p.img
    backB.style.width = p.backW + 'px'
    backB.style.height = p.h + 'px'
    try { await backB.decode() } catch {}
    anim.fade = backB.animate([{ opacity: 0 }, { opacity: 1 }], { duration: p.durMs, easing: 'ease', fill: 'forwards' })
    anim.fade.onfinish = () => { window.wcov.done(anim.gen, 'crossfade') }
  })

  // Mid-flight reversal (workspace-tj1z.4): the SAME snapshots serve both directions —
  // WAAPI reverse() replays the slide/corner/scrim back to their starting states.
  // onfinish still fires at the reversed end, so main's slide-done handling is uniform.
  window.wcov.onReverse(p => {
    if (p.gen !== anim.gen || !anim.slide) return
    anim.phase = 'slide'
    // The handle MUST be in this array. Every animation here carries fill:'forwards',
    // so one left out would run on to the wrong end and stay pinned there — the bar
    // would sit horizontal over a drawer that had just shut.
    for (const a of [anim.slide, anim.corner, anim.scrimAnim,
      anim.fillAnim, anim.labelAAnim, anim.labelBAnim, anim.strokeLAnim, anim.strokeBAnim]) { try { a && a.reverse() } catch {} }
  })

  window.wcov.onAbort(() => cancelAll())

  // Gate introspection (workspace-tj1z.5): live card position in CSS px.
  window.__anim = () => {
    let cardX = null
    if (card.style.display !== 'none') {
      const m = getComputedStyle(card).transform
      const match = /matrix\(([^)]+)\)/.exec(m)
      if (match) cardX = Math.round(parseFloat(match[1].split(',')[4]))
      else if (m === 'none') cardX = 0
    }
    const progress = anim.slide && anim.slide.effect
      ? (anim.slide.currentTime || 0) / (anim.slide.effect.getTiming().duration || 1)
      : null
    // Live handle geometry, read back off the composited matrix — a gate asserts where
    // the bar actually IS and which way it runs, not that an animation object exists.
    let hnd = null
    if (railFill.style.display !== 'none') {
      const r = railFill.getBoundingClientRect()
      hnd = {
        cx: Math.round(r.left + (r.width / 2)),
        cy: Math.round(r.top + (r.height / 2)),
        w: Math.round(r.width),
        h: Math.round(r.height),
        orient: r.width >= r.height ? 'horizontal' : 'vertical'
      }
    }
    return { phase: anim.phase, gen: anim.gen, cardX, progress, handle: hnd }
  }
</script>
</body>
</html>
