<!doctype html>
<meta charset="utf-8">
<title>Wire Copy</title>
<style>
  /* Styling WE own — no user terminal dictates any of this. */
  /* Bundled brand font (workspace-vcpf): identical cell metrics + glyph coverage on
     every platform — braille spinners U+28xx, box drawing, ▌★⇒ all ship with the app;
     color emoji (🎧) intentionally falls through to the platform emoji font. */
  /* WOFF2, not TTF (workspace-o8wex): the explicit document.fonts.load gate below holds
     term:ready — and therefore the corrective pty resize and the first correct frame —
     until both faces have downloaded, so their size is on the boot path. 677KB of raw
     TrueType becomes 292KB of WOFF2. The conversion is lossless and was verified as such
     rather than assumed: identical cmap (3322/3261 entries), identical glyph order,
     identical advance widths and head/hhea metrics, and ZERO differing glyph outlines,
     so the cell box xterm measures cannot move. */
  @font-face { font-family: 'WireCopy Mono'; src: url('fonts/DejaVuSansMono.woff2') format('woff2'); font-weight: normal; font-style: normal; }
  @font-face { font-family: 'WireCopy Mono'; src: url('fonts/DejaVuSansMono-Bold.woff2') format('woff2'); font-weight: bold; font-style: normal; }
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; }
  #pad  { height: 100%; box-sizing: border-box; padding: 16px 8px 8px 16px; }
  #term { height: 100%; }
  .xterm .xterm-viewport { background: transparent !important; }

  /* Boot chrome (workspace-e9bje). The window is created immediately but the shell
     painted nothing of its own, so the first thing a launch showed was a solid black
     rectangle until the TUI's first frame — measured at about 190ms on the boot
     timeline, which is short but reads as "did it launch?" rather than as the app.
     This is deliberately dependency-free: no bundled font (the fonts are exactly what
     the gate below is WAITING for), no image, no script — plain markup that paints on
     the first frame the compositor produces. It sits over everything, takes no pointer
     events, and is removed the moment the TUI writes its first byte. */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #000;
    font-family: ui-monospace, 'DejaVu Sans Mono', monospace;
    pointer-events: none;
    transition: opacity 140ms linear;
  }
  #boot.gone { opacity: 0; }
  #boot .wordmark {
    color: #00d700;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-shadow: 0 0 9px rgba(0, 215, 0, 0.5), 0 0 24px rgba(0, 215, 0, 0.26),
                 0 0 48px rgba(0, 215, 0, 0.12);
  }
  #boot .tag { color: #ff87d7; font-size: 15px; letter-spacing: 0.06em; }
  #boot .rule { color: #005f00; font-size: 13px; letter-spacing: 0.5em; }
</style>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<div id="boot">
  <div class="wordmark">Wire Copy</div>
  <div class="tag">All copy, no nonsense</div>
  <div class="rule">────────</div>
</div>
<script>
  // Boot-paint timeline (workspace-e9bje), in ms since this page started loading. A probe
  // reads these to say how long the window is blank; both are recorded from the frame
  // callback that actually PAINTS, not from when the markup was parsed.
  window.__bootMarks = { chromePainted: null, firstPty: null }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (window.__bootMarks.chromePainted == null) window.__bootMarks.chromePainted = Math.round(performance.now())
  }))
</script>
<div id="pad"><div id="term"></div></div>
<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script>
  // Type scale (workspace-9d04): the shell owns the initial size (persisted zoom) via
  // the query string. The BUNDLED font leads the stack (workspace-vcpf) so metrics and
  // glyph coverage are identical on every platform; the per-platform names remain as
  // fallback only (e.g. while the bundled files are missing in a broken install).
  const params = new URLSearchParams(location.search)
  const plat = params.get('plat') || 'linux'
  const FALLBACKS = plat === 'darwin'
    ? "'SF Mono', Menlo, Monaco, monospace"
    : plat === 'win32'
      ? "'Cascadia Mono', Consolas, monospace"
      : "'DejaVu Sans Mono', 'Noto Sans Mono', 'Liberation Mono', monospace"
  const FONT_STACK = `'WireCopy Mono', ${FALLBACKS}`
  const FONT_PX = Number(params.get('font')) || 18
  const term = new Terminal({
    fontFamily: FONT_STACK,
    fontSize: FONT_PX,
    // Cell metrics pinned (workspace-vcpf): the terminal look must not drift with
    // renderer defaults. lineHeight 1 keeps box-drawing rows contiguous.
    lineHeight: 1.0,
    letterSpacing: 0,
    cursorBlink: false,
    allowProposedApi: true,
    scrollback: 200,
    // Design system (workspace-7t0a.1): bold must NOT brighten classic-ANSI green
    // to neon #00ff00 — the same washout class that hit the Avalonia shell.
    drawBoldTextInBrightColors: false,
    theme: {
      // Pure terminal black (--tr-bg-pure); body fallback is the phosphor green —
      // the TUI colors nearly everything explicitly, so unstyled spill reads green.
      background: '#000000',
      foreground: '#00d700',
      cursor: '#ff87d7',
      selectionBackground: '#005f87',
      // ANSI 16 pinned to the CLASSIC XTERM palette (workspace-vcpf): xterm.js
      // defaults to Tango (olive green #4e9a06 etc), which visibly diverges from
      // terminal mode (TERM=xterm-256color; the 256 cube already matches xterm).
      // The two magentas stay brand-pink — a deliberate theme override, kept.
      black: '#000000',
      red: '#cd0000',
      green: '#00cd00',
      yellow: '#cdcd00',
      blue: '#0000ee',
      magenta: '#ff87d7',
      cyan: '#00cdcd',
      white: '#e5e5e5',
      brightBlack: '#7f7f7f',
      brightRed: '#ff0000',
      brightGreen: '#00ff00',
      brightYellow: '#ffff00',
      brightBlue: '#5c5cff',
      brightMagenta: '#ffa8e2',
      brightCyan: '#00ffff',
      brightWhite: '#ffffff'
    }
  })
  const fit = new FitAddon.FitAddon()
  term.loadAddon(fit)
  // The bundled font MUST be resolved before xterm measures its cell box — measuring
  // against the fallback caches wrong metrics and the first paint renders off-grid.
  Promise.all([
    document.fonts.load(`${FONT_PX}px 'WireCopy Mono'`),
    document.fonts.load(`bold ${FONT_PX}px 'WireCopy Mono'`)
  ]).catch(() => {}).then(() => {
  term.open(document.getElementById('term'))
  fit.fit()
  term.focus()

  term.onData(d => wc.input(d))
  // The TUI's first byte IS the app arriving; drop the boot chrome on it (workspace-e9bje).
  // Tied to real output rather than a timer, so a slow start shows the chrome for longer
  // instead of flashing back to black.
  let bootShown = true
  wc.onPtyData(d => {
    if (bootShown) {
      bootShown = false
      if (window.__bootMarks && window.__bootMarks.firstPty == null) {
        window.__bootMarks.firstPty = Math.round(performance.now())
      }
      const b = document.getElementById('boot')
      if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 200) }
    }
    term.write(d)
  })
  wc.ready({ cols: term.cols, rows: term.rows })

  // Live zoom (Cmd/Ctrl +/-/0 handled shell-side): a font change resizes CELLS, not the
  // container, so the ResizeObserver below never fires — refit and re-report explicitly.
  wc.onFont(px => {
    term.options.fontSize = px
    fit.fit()
    wc.resize({ cols: term.cols, rows: term.rows })
  })

  new ResizeObserver(() => {
    fit.fit()
    wc.resize({ cols: term.cols, rows: term.rows })
  }).observe(document.getElementById('term'))

  // In embedded views document.hasFocus() follows WINDOW focus — the keeper and the
  // focus listener must stand down while the shell says the page pane owns the keyboard.
  let shellMode = 'reader'
  wc.onMode(m => { shellMode = m })
  window.addEventListener('focus', () => { if (shellMode === 'reader') term.focus() })
  setInterval(() => {
    if (shellMode === 'reader' && document.hasFocus() &&
        (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA')) term.focus()
  }, 250)

  // Keystroke-never-lost, page edition (workspace-ai4c audit): between keeper ticks a
  // key can land on this PAGE while xterm's textarea isn't focused — it would die
  // silently (xterm reads only from its textarea; the field shape: the first 'o' after
  // a pane reveal does nothing). Feed such keys straight to the pty, then refocus.
  const GAP_KEYS = { Enter: '\r', Escape: '\u001b', Tab: '\t', Backspace: '\u007f', ArrowUp: '\u001b[A', ArrowDown: '\u001b[B', ArrowRight: '\u001b[C', ArrowLeft: '\u001b[D' }
  document.addEventListener('keydown', e => {
    if (shellMode !== 'reader' || e.isComposing) return
    if (term.textarea && document.activeElement === term.textarea) return // xterm owns it
    const seq = (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) ? e.key : GAP_KEYS[e.key]
    if (seq) { e.preventDefault(); wc.input(seq) }
    term.focus()
  }, true)

  // Gate/debug hooks (read-only introspection of the pane).
  window.__dims = () => ({ cols: term.cols, rows: term.rows })
  window.__font = () => term.options.fontSize
  window.__termText = () => {
    const b = term.buffer.active
    const out = []
    for (let i = 0; i < b.length; i++) out.push(b.getLine(i) ? b.getLine(i).translateToString(false) : '')
    return out.join('\n')
  }
  window.__wc = {
    reveal: o => wc.reveal(o),
    setMode: m => wc.setMode(m),
    state: () => wc.state(),
    nav: u => wc.nav(u),
    lensEval: e => wc.lensEval(e),
    probeCertDefaultSession: u => wc.probeCertDefaultSession(u)
  }
  }) // font-load gate
</script>
