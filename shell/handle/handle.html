<!doctype html>
<!-- Wire Copy drawer handle (workspace-2dmuu). A thin always-present strip carrying the
     browser sidecar's pull: vertical on the dock edge while the drawer is shut,
     horizontal over the top of the live page once it is open. Display-only in the same
     sense as the launcher and link-tree panes — it holds no dock state and decides
     nothing. A click sends ONE message to main, which writes '|' to the TUI's stdin;
     the TUI then drives the reveal exactly as it does for a real keypress, so the
     drawer has a single authority. The vertical→horizontal re-orientation is played by
     a proxy of this same bar inside overlay.html (both load handle.css). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wire Copy — Drawer handle</title>
<link rel="stylesheet" href="../launcher/tokens.css">
<link rel="stylesheet" href="handle.css">
</head>
<body data-orient="vertical">
  <div id="clip" class="wc-bar-clip"><div id="bar" class="wc-bar"></div></div>
<script>
'use strict'

// The resting orientation is pushed by main alongside every layout change, so the bar
// is already correct the moment the transition overlay drops off it.
function apply (orient) {
  document.body.dataset.orient = orient === 'horizontal' ? 'horizontal' : 'vertical'
}

// A click anywhere in the strip pulls the drawer — the whole strip is the hit target,
// not just the painted 4px stroke. `click` (not pointerdown) so a press that slides off
// the bar cancels, the way every other button in the world behaves.
document.addEventListener('click', () => { if (window.wch) window.wch.toggle() })

// ── Gate / introspection hooks ─────────────────────────────────────────────────
// The bar's rect in viewport px plus its orientation: a gate asserts the OUTCOME
// (where the bar actually is and which way it runs), never mere presence.
window.__handle = () => {
  const r = document.getElementById('bar').getBoundingClientRect()
  return {
    orient: document.body.dataset.orient,
    bar: { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) },
    view: { w: window.innerWidth, h: window.innerHeight }
  }
}

apply(new URLSearchParams(location.search).get('orient'))
if (window.wch) wch.onState(msg => apply(msg && msg.orient))
</script>
</body>
</html>
