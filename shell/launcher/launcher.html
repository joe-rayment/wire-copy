<!doctype html>
<!-- Wire Copy launcher pane (workspace-irp7 L1 / workspace-3bnye L4). In shell mode
     the launcher becomes a real HTML WebContentsView that PROJECTS TUI launcher state
     pushed over IPC. The TUI keeps ALL logic and keyboard handling; this page is
     STRICTLY display-only — no key handlers, no links, no focusable elements. It paints
     whatever `window.__renderLauncher(msg)` is handed and nothing more. Design imported
     from "Wire Copy Launcher.dc.html" (claude.ai design project 153674f7): CRT-glow
     "Wire Copy" title with blinking block cursor, LEFT-aligned column at the screen
     edge. Card styling predates that import and is deliberately kept. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wire Copy</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div id="stage">
    <div id="column">
      <div id="masthead">
        <div id="masthead-inner">
          <div id="eyebrow"><span class="tick">▌</span> Launcher</div>
          <div id="title-row">
            <span id="apptitle">Wire Copy</span>
            <span id="cursor-block"></span>
          </div>
          <div id="tagline"></div>
        </div>
        <div id="scanlines"></div>
      </div>
      <div id="urlbar-wrap"><div id="urlbar"></div></div>
      <div id="setuphint" style="display:none"></div>
      <div id="paging-top" class="paging hidden"></div>
      <div id="grid"></div>
      <div id="paging-bottom" class="paging hidden"></div>
      <div id="footer">
        <div id="footer-hints"></div>
        <div id="footer-right"></div>
      </div>
    </div>
  </div>
<script>
'use strict'

// Footer key hints — the launcher's signature bindings, matching the TUI footer.
const HINTS = [
  ['Enter', 'open'], ['1-9', 'jump'], ['o', 'go to url'], ['a', 'add'], ['?', 'all keys']
]

const $ = id => document.getElementById(id)
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

let lastMsg = null

// One-time static chrome: the footer hints never change; the masthead title
// block ("▌ Launcher" / Wire Copy / cursor / scanlines) is static markup above.
function paintChrome () {
  $('footer-hints').innerHTML = HINTS
    .map(([k, label]) =>
      `<span class="kbd"><span class="brk">[</span><span class="key">${esc(k)}</span><span class="brk">]</span>:${esc(label)}</span>`)
    .join('')
}

function paintTagline (state) {
  const tag = state.tagline || 'All copy, no nonsense'
  const ver = state.version || ''
  $('tagline').innerHTML =
    `${esc(tag)}${ver ? `<span class="sep">·</span><span class="ver">${esc(ver)}</span>` : ''}`
}

// URL bar: placeholder when idle; when typing, the buffer in phosphor green with
// an inverse-video block cursor sitting on the char at `cursor` (a trailing space
// when the cursor is past the end). Empty buffer while typing shows the placeholder.
function paintUrlBar (state) {
  const bar = $('urlbar')
  const typing = state.urlTyping
  const focused = state.selectedIndex === -1 || !!typing
  bar.classList.toggle('focused', focused)

  if (typing && typing.buffer && typing.buffer.length > 0) {
    const buf = typing.buffer
    const cur = Math.max(0, Math.min(typing.cursor ?? buf.length, buf.length))
    const before = buf.slice(0, cur)
    const at = cur < buf.length ? buf[cur] : ' '
    const after = cur < buf.length ? buf.slice(cur + 1) : ''
    bar.innerHTML =
      `<span class="typed">${esc(before)}</span>` +
      `<span class="cursor">${esc(at)}</span>` +
      `<span class="typed">${esc(after)}</span>`
  } else if (typing) {
    bar.innerHTML = `<span class="cursor"> </span><span class="placeholder">Go to URL…</span>`
  } else {
    bar.innerHTML = `<span class="placeholder">Go to URL…</span>`
  }
}

function cardHtml (slot, selected) {
  if (!slot || slot.kind === 'empty') {
    return `<div class="card empty"></div>`
  }
  const isReadingList = slot.kind === 'readingList'
  const star = (slot.star || isReadingList) ? `<span class="rl-star">★</span>` : ''
  // Jump digit comes straight from slot.badge ("1".."9", or null past slot 9 and
  // for kind:"empty" pads) — NOT derived from slot.index (the global 0-based
  // virtual index). Nothing renders when badge is null.
  const idx = (slot.badge != null && slot.badge !== '')
    ? `<div class="card-index">[${esc(slot.badge)}]</div>` : ''
  // Second line is the TUI display hint. Only the Reading List's EMPTY-state
  // prompt is quiet muted (LauncherRenderer keys muted on readingListCount 0/null);
  // a populated "N saved articles" wears metadata green exactly like the bookmark
  // domains. slot.url carries the full URL and is deliberately NOT shown.
  const quietHint = isReadingList && /^nothing saved yet/.test(slot.hint || '')
  const second = `<div class="card-url${quietHint ? ' hint' : ''}">${esc(slot.hint || '')}</div>`
  return (
    `<div class="card${selected ? ' selected' : ''}">` +
      `<div class="card-title-row">` +
        `<div class="card-title">${esc(slot.title || '')}${star}</div>` +
        idx +
      `</div>` +
      second +
    `</div>`
  )
}

function paintGrid (state) {
  const slots = state.slots || []
  $('grid').innerHTML = slots
    .map((slot, i) => cardHtml(slot, i === state.selectedIndex))
    .join('')
}

function paintPaging (state) {
  const slots = state.slots || []
  const pg = state.paging || { offset: 0, visible: slots.length, total: slots.length }
  // visible = the count of REAL tiles in the window (trailing kind:"empty" pads
  // don't count), so the range end and the more-below test ignore the pads.
  const visible = pg.visible != null ? pg.visible : slots.length
  const hasAbove = pg.offset > 0
  const hasBelow = (pg.offset + visible) < pg.total
  const top = $('paging-top')
  const bot = $('paging-bottom')
  top.classList.toggle('hidden', !hasAbove)
  bot.classList.toggle('hidden', !hasBelow)
  const range = `showing ${pg.offset + 1}–${pg.offset + visible} of ${pg.total}`
  if (hasAbove) top.textContent = `▲ more · ${range}`
  if (hasBelow) bot.textContent = `▼ more · ${range}`
}

function paintFooter (state) {
  const f = state.footer || {}
  const count = state.bookmarkCount === 1 ? '1 bookmark' : `${state.bookmarkCount ?? 0} bookmarks`
  const parts = []
  if (f.badge) parts.push(`<span class="badge">${esc(f.badge)}</span>`)
  if (f.status) parts.push(`<span class="status">${esc(f.status)}</span>`)
  parts.push(`<span class="count">${esc(count)}</span>`)
  $('footer-right').innerHTML = parts.join('')
}

function paintSetupHint (state) {
  const el = $('setuphint')
  if (state.setupHint) {
    el.style.display = ''
    el.textContent = state.setupHint
  } else {
    el.style.display = 'none'
  }
}

// Idempotent full re-render from a pushed state message. State pushes are
// low-frequency, so a straight rebuild is simplest and cannot drift.
window.__renderLauncher = function (msg) {
  lastMsg = msg
  const state = (msg && msg.state) || {}
  paintTagline(state)
  paintUrlBar(state)
  paintSetupHint(state)
  paintGrid(state)
  paintPaging(state)
  paintFooter(state)
  window.__launcherReady = true
}

// ── Zoom: the shell persists a font size; apply it before first paint so the
//    saved zoom is honoured immediately. zoom = px / 18 (design body = 18px). ──
window.__applyFont = function (px) {
  const n = Number(px) || 18
  document.documentElement.style.zoom = String(n / 18)
}

// ── Gate / introspection hooks ─────────────────────────────────────────────
window.__launcherState = () => lastMsg
window.__launcherReady = false

// ── Demo fixtures (?demo=…) for development and gates — content mirrors the
//    reference screenshot (NYT first, READING LIST ★ second, MACLEAN'S, CBC
//    NEWS, plus more so paging is exercised). ────────────────────────────────
// Wire shape (L2): `index` is the GLOBAL 0-based virtual index (Reading List = 1);
// `badge` is the separate jump digit ("1".."9", null past slot 9); `url` is the
// full URL (NOT shown); `hint` is the displayed second line (domain, or the
// Reading List's saved/empty copy).
function demoSlots () {
  return [
    { index: 0, kind: 'bookmark',    badge: '1',  title: "NYT TODAY'S PAPER", url: 'https://www.nytimes.com',     hint: 'www.nytimes.com',      star: false },
    { index: 1, kind: 'readingList', badge: '2',  title: 'READING LIST',      url: null,                          hint: 'nothing saved yet — press s to add', star: true },
    { index: 2, kind: 'bookmark',    badge: '3',  title: "MACLEAN'S",         url: 'https://macleans.ca',         hint: 'macleans.ca',          star: false },
    { index: 3, kind: 'bookmark',    badge: '4',  title: 'CBC NEWS',          url: 'https://www.cbc.ca',          hint: 'www.cbc.ca',           star: false },
    { index: 4, kind: 'bookmark',    badge: '5',  title: 'THE GUARDIAN',      url: 'https://www.theguardian.com', hint: 'www.theguardian.com',  star: false },
    { index: 5, kind: 'bookmark',    badge: '6',  title: 'THE VERGE',         url: 'https://www.theverge.com',    hint: 'www.theverge.com',     star: false },
    { index: 6, kind: 'bookmark',    badge: '7',  title: 'HACKER NEWS',       url: 'https://news.ycombinator.com', hint: 'news.ycombinator.com', star: false },
    { index: 7, kind: 'bookmark',    badge: '8',  title: 'ARS TECHNICA',      url: 'https://arstechnica.com',     hint: 'arstechnica.com',      star: false },
    { index: 8, kind: 'bookmark',    badge: '9',  title: 'WIRED',             url: 'https://www.wired.com',       hint: 'www.wired.com',        star: false },
    { index: 9, kind: 'bookmark',    badge: null, title: 'THE ATLANTIC',      url: 'https://www.theatlantic.com', hint: 'www.theatlantic.com',  star: false }
  ]
}

function demoMsg (kind) {
  const all = demoSlots()
  const base = {
    visible: true,
    state: {
      slots: all.slice(0, 6),
      selectedIndex: 0,
      urlTyping: null,
      setupHint: null,
      paging: { offset: 0, visible: 6, total: all.length },
      bookmarkCount: 9,
      footer: { badge: null, status: null },
      tagline: 'All copy, no nonsense',
      version: 'v1.0'
    }
  }
  const s = base.state
  switch (kind) {
    case 'typing':
      s.selectedIndex = -1
      s.urlTyping = { buffer: 'example.co', cursor: 10 }
      break
    case 'setuphint':
      s.selectedIndex = -1
      s.setupHint = 'Optional: add API keys for podcasts & AI layout · press c'
      break
    case 'paged':
      s.slots = all.slice(4, 10)
      s.selectedIndex = 0
      s.paging = { offset: 4, visible: 6, total: all.length }
      break
    case 'emptyrl':
      s.selectedIndex = 1
      break
    default:
      break
  }
  return base
}

// ── Boot ────────────────────────────────────────────────────────────────────
paintChrome()

const params = new URLSearchParams(location.search)
// Apply persisted zoom BEFORE first paint so it never flashes at the wrong scale.
window.__applyFont(params.get('font') || 18)

const demo = params.get('demo')
if (demo != null) {
  window.__renderLauncher(demoMsg(demo))
}

// Subscribe to live state / font pushes when the shell bridge is present.
if (window.wclau) {
  wclau.onState(msg => window.__renderLauncher(msg))
  if (wclau.onFont) wclau.onFont(px => window.__applyFont(px))
}
</script>
</body>
</html>
